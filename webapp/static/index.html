<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Holiday Lights</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 10px; }
        .btn-primary { background-color: #bb86fc; border: none; color: #000; }
        .btn-primary:hover { background-color: #a370f7; }
        #loading { display: none; }
        .code-snippet { font-family: monospace; font-size: 0.8em; color: #888; }
    </style>
</head>
<body class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="text-center mb-4">🎄 AI Light Controller 🎄</h1>
            
            <div class="card p-4">
                <div class="mb-3">
                    <label for="promptInput" class="form-label">Describe an Animation</label>
                    <textarea class="form-control bg-dark text-light" id="promptInput" rows="3" placeholder="e.g., A slow wave of blue and white moving left to right..."></textarea>
                </div>
                <button id="generateBtn" class="btn btn-primary w-100">Make it shine!</button>
                <div id="loading" class="text-center mt-3">
                    <div class="spinner-border text-light" role="status"></div>
                    <p>Asking Gemini to write Python...</p>
                </div>
            </div>

            <h3 class="mt-5">History</h3>
            <div id="historyList">
                <!-- History items go here -->
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            loadHistory();

            $('#generateBtn').click(function() {
                const prompt = $('#promptInput').val().trim();
                if (!prompt) return;

                $('#loading').show();
                $('#generateBtn').prop('disabled', true);

                $.ajax({
                    url: '/generate',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ prompt: prompt }),
                    success: function(response) {
                        $('#loading').hide();
                        $('#generateBtn').prop('disabled', false);
                        $('#promptInput').val('');
                        
                        // Add to top of list immediately
                        addHistoryItem(prompt, "Just now");
                    },
                    error: function(xhr) {
                        $('#loading').hide();
                        $('#generateBtn').prop('disabled', false);
                        alert("Error: " + (xhr.responseJSON ? xhr.responseJSON.detail : "Unknown error"));
                    }
                });
            });

            function loadHistory() {
                $.get('/history', function(data) {
                    $('#historyList').empty();
                    data.forEach(function(item) {
                        addHistoryItem(item.prompt, item.timestamp);
                    });
                });
            }

            function addHistoryItem(prompt, timestamp) {
                const dateStr = timestamp ? new Date(timestamp).toLocaleString() : '';
                const html = `
                    <div class="card p-3 fade-in">
                        <div class="d-flex justify-content-between">
                            <strong>${prompt}</strong>
                            <small class="text-muted">${dateStr}</small>
                        </div>
                    </div>
                `;
                $('#historyList').prepend(html);
            }
        });
    </script>
</body>
</html>
